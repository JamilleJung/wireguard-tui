name: Release

# Tag a version to cut a release:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# Release gate (fail closed): `publish` runs only if EVERY job below
# succeeded — version consistency, fmt/clippy, tests, audit, the firewall
# namespace test, the kill switch end-to-end test, all four static builds,
# the .deb, QEMU smoke tests of every architecture, signing, and independent
# verification of the signed artifacts. A skipped or cancelled job blocks it.
#
# Dry run: start the workflow manually from any branch with a version. Every
# job runs and is verified exactly like a tagged release, except that the
# checksums are signed with a throwaway key and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build as a dry run (no publish), e.g. 1.10.0"
        required: true
        type: string

# Least privilege: the token is read-only everywhere except the publish job.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The tag being released; for a dry run, the tag the version would get.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  # ---------------------------------------------------------------- checks
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, Cargo.toml, Cargo.lock, CHANGELOG and packaging agree
        run: bash scripts/check-version.sh --tag "$RELEASE_TAG"

  lint:
    name: rustfmt & clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Shell lint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning install.sh tests/*.sh scripts/*.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: bash scripts/gen-fixtures.sh --check
      - run: cargo test --locked
      - name: Property tests with more cases
        env:
          PROP_CASES: "20000"
        run: cargo test --locked --release --test 'prop_*'
      - run: bash tests/installer-sanity.sh

  audit:
    name: Audit release dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the release lockfile
        run: cargo audit --deny warnings

  namespace:
    name: Firewall namespace test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install firewall tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iptables
      - run: bash tests/firewall-namespace.sh

  # ---------------------------------------------------------------- builds
  # Static musl binaries for every supported CPU (32- and 64-bit).
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, arch: x86_64 }
          - { target: i686-unknown-linux-musl, arch: i686 }
          - { target: aarch64-unknown-linux-musl, arch: aarch64 }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7 }
    env:
      # Link the musl TARGET binaries with the toolchain's own cross-linker
      # (rust-lld). Set it PER TARGET (not via global RUSTFLAGS) so it never
      # touches host build-scripts / proc-macros / `cargo install`, which must
      # link with the default host linker. This yields fully static binaries for
      # every CPU without Docker or an external cross-gcc.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and package version
        run: bash scripts/check-version.sh --tag "$RELEASE_TAG"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-auditable
        run: cargo install cargo-auditable --version =0.7.7 --locked

      - name: Build static binaries (musl, with embedded SBOM)
        run: cargo auditable build --release --locked --target ${{ matrix.target }}

      # Shrink the shipped static binaries (~60% smaller on disk). Every packed
      # binary is executed for its architecture in the `smoke` job (QEMU).
      - name: Compress binaries with UPX
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends upx-ucl
          upx --best --lzma "target/${TARGET}/release/wg-tui" "target/${TARGET}/release/wg-helper"
          upx -t "target/${TARGET}/release/wg-tui" "target/${TARGET}/release/wg-helper"

      # Deterministic archive (fixed modes, root ownership, sorted entries,
      # commit time as mtime) so scripts/verify-release.sh can pin it exactly.
      - name: Stage tarball
        env:
          REF: ${{ env.RELEASE_TAG }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/stage-tarball.sh "${REF#v}" "$ARCH" "target/${TARGET}/release"

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.arch }}
          path: wireguard-tui-*-${{ matrix.arch }}-linux.tar.gz
          if-no-files-found: error

  # Native x86_64 build packaged as a .deb.
  deb:
    name: Build .deb (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag and package version
        run: bash scripts/check-version.sh --tag "$RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --version =0.7.7 --locked
      - name: Build
        run: cargo auditable build --release --locked
      - name: CLI contract before packing
        run: |
          bash tests/helper-validation.sh target/release/wg-helper
          bash tests/release-regression.sh --version "${RELEASE_TAG#v}" target/release/wg-tui target/release/wg-helper
      # Shrink the shipped binaries before packaging the .deb (~60% smaller on
      # disk). Re-checked so a broken pack fails the release rather than shipping.
      - name: Compress binaries with UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends upx-ucl
          upx --best --lzma target/release/wg-tui target/release/wg-helper
          bash tests/release-regression.sh --version "${RELEASE_TAG#v}" target/release/wg-tui target/release/wg-helper
      - name: Build .deb
        run: |
          cargo install cargo-deb --version =3.8.0 --locked
          cargo deb --no-build --no-strip || cargo deb
          cp target/debian/*.deb .   # mandatory: fail the release if none exists
      - name: Upload .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-amd64
          path: "*.deb"
          if-no-files-found: error

  # ---------------------------------------------------------------- binary tests
  # Run every shipped (UPX-packed, static) binary for its own architecture:
  # i686 natively, aarch64/armv7 through QEMU user-mode emulation (binfmt).
  smoke:
    name: Smoke ${{ matrix.arch }} (QEMU)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, qemu: "" }
          - { arch: i686, qemu: "" }
          - { arch: aarch64, qemu: arm64 }
          - { arch: armv7, qemu: arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU user-mode emulation
        if: matrix.qemu != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.qemu }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-${{ matrix.arch }}
          path: dist
      - name: Unpack
        id: unpack
        env:
          ARCH: ${{ matrix.arch }}
          REF: ${{ env.RELEASE_TAG }}
        run: |
          tar -xzf "dist/wireguard-tui-${REF#v}-${ARCH}-linux.tar.gz" -C dist
          dir="dist/wireguard-tui-${REF#v}-${ARCH}-linux"
          file "$dir/wg-tui" "$dir/wg-helper"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: --version / --help
        env:
          DIR: ${{ steps.unpack.outputs.dir }}
          REF: ${{ env.RELEASE_TAG }}
        run: |
          test "$("$DIR/wg-tui" --version)" = "wg-tui ${REF#v}"
          "$DIR/wg-tui" --help | grep -q '^wg-tui '
      - name: Helper argument validation
        run: bash tests/helper-validation.sh "${{ steps.unpack.outputs.dir }}/wg-helper"
      - name: Release regression (CLI contract)
        env:
          DIR: ${{ steps.unpack.outputs.dir }}
          REF: ${{ env.RELEASE_TAG }}
        run: bash tests/release-regression.sh --version "${REF#v}" "$DIR/wg-tui" "$DIR/wg-helper"

  # WireGuard + kill switch + live config update with the shipped helper.
  e2e:
    name: Kill switch e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-x86_64
          path: dist
      - name: Install WireGuard and firewall tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wireguard-tools nftables iptables iproute2 iputils-ping
          sudo modprobe wireguard
      - name: End-to-end test with the release helper
        env:
          REF: ${{ env.RELEASE_TAG }}
        run: |
          tar -xzf "dist/wireguard-tui-${REF#v}-x86_64-linux.tar.gz" -C dist
          test -f tests/killswitch-e2e.sh || { echo "::error::tests/killswitch-e2e.sh is missing"; exit 1; }
          sudo bash tests/killswitch-e2e.sh "dist/wireguard-tui-${REF#v}-x86_64-linux/wg-helper"

  # ---------------------------------------------------------------- sign & verify
  sign:
    name: Checksums & signature
    needs: [build, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Collect artifacts
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.deb' \) -exec cp -v {} out/ \;
          # A dry run signs with a throwaway key; shipping the project key
          # beside it would (rightly) fail verification.
          if [ "$EVENT" = push ]; then cp minisign.pub out/; fi
          ls -l out
      - name: Generate checksums
        working-directory: out
        run: |
          shopt -s nullglob
          artifacts=( *.tar.gz *.deb )
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::no artifacts to checksum"; exit 1
          fi
          sha256sum "${artifacts[@]}" | tee SHA256SUMS
          test -s SHA256SUMS
      - name: Sign SHA256SUMS with minisign (fail-closed)
        if: github.event_name == 'push'
        working-directory: out
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          REF: ${{ env.RELEASE_TAG }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::error::MINISIGN_KEY secret not set — refusing to publish an unsigned release"
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          umask 077
          trap 'rm -f minisign.key' EXIT
          printf '%s\n' "$MINISIGN_KEY" > minisign.key
          minisign -S -s minisign.key -m SHA256SUMS -t "wireguard-tui ${REF#v}"
          rm -f minisign.key
          minisign -Vm SHA256SUMS -p minisign.pub
          test -s SHA256SUMS.minisig
      - name: Sign SHA256SUMS with a throwaway key (dry run)
        if: github.event_name != 'push'
        working-directory: out
        env:
          REF: ${{ env.RELEASE_TAG }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          mkdir -p ../dry-run-key
          minisign -G -W -p ../dry-run-key/dry-run.pub -s ../dry-run.key
          minisign -S -s ../dry-run.key -m SHA256SUMS -t "wireguard-tui ${REF#v}"
          rm -f ../dry-run.key
          minisign -Vm SHA256SUMS -p ../dry-run-key/dry-run.pub
          test -s SHA256SUMS.minisig
      - name: Upload the dry-run public key
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-key
          path: dry-run-key/
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed release set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: out/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify release artifacts
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU user-mode emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64,arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: out
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign upx-ucl dpkg file
      # Signature against the COMMITTED key, checksums, archive contents and
      # modes, static linkage, architecture, embedded version == tag, .deb
      # metadata, and the CLI contract of every architecture's binaries.
      - name: Download the dry-run public key
        if: github.event_name != 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dry-run-key
          path: dry-run-key
      - name: scripts/verify-release.sh --strict --run
        env:
          EVENT: ${{ github.event_name }}
        run: |
          key=()
          if [ "$EVENT" != push ]; then key=(--pubkey dry-run-key/dry-run.pub); fi
          bash scripts/verify-release.sh --strict --run "${key[@]}" --tag "$RELEASE_TAG" out

  # ---------------------------------------------------------------- publish
  publish:
    name: Publish release
    needs: [version, lint, test, audit, namespace, build, deb, smoke, e2e, sign, verify]
    # The default `success()` condition already skips publishing unless every
    # needed job succeeded; the explicit check below also refuses to run if a
    # future edit loosens this condition.
    if: ${{ success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # elevated ONLY for the publishing job
    steps:
      - name: Every gate job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | length == 11 and all(.value.result == "success")' >/dev/null \
            || { echo "::error::release gate not satisfied"; echo "$NEEDS" | jq .; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: out
      - name: Publish exactly the verified bytes
        working-directory: out
        run: sha256sum -c --strict SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz
            out/*.deb
            out/SHA256SUMS
            out/SHA256SUMS.minisig
            out/minisign.pub
