name: CI

# Every job name below is a required status check on `main` (see
# docs/REPO_SETTINGS.md); renaming a job means updating the ruleset too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# CI never needs to write; keep the token read-only regardless of repo default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fallback when Cargo.toml has no `rust-version`; the lowest toolchain the
  # current lockfile builds with (ratatui 0.30 needs 1.88).
  MSRV_FALLBACK: "1.88"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fixtures match scripts/gen-fixtures.sh (fake, deterministic)
        run: bash scripts/gen-fixtures.sh --check
      - name: cargo test (unit, property and fixture tests)
        run: cargo test --locked
      - name: Property tests with more cases
        env:
          PROP_CASES: "20000"
        run: cargo test --locked --release --test 'prop_*'

  build:
    name: Release build & CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build (release)
        run: cargo build --release --locked
      - name: Smoke test (binary starts & parses args)
        run: |
          ./target/release/wg-tui --version | grep -q '^wg-tui '
          ./target/release/wg-tui --help >/dev/null
          # `doctor` must print the checklist and exit with a valid code
          # (0/1/2), never crash — regardless of what the runner has installed.
          out="$(./target/release/wg-tui doctor)" && rc=0 || rc=$?
          echo "$out" | grep -q 'WireGuard tools'
          test "$rc" -le 2
      - name: Helper argument validation
        run: bash tests/helper-validation.sh target/release/wg-helper
      - name: CLI contract (release regression)
        run: bash tests/release-regression.sh target/release/wg-tui target/release/wg-helper

  shell:
    name: Shell lint & installer sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Shell syntax and lint (installer, tests, scripts)
        run: |
          shopt -s nullglob
          scripts=(install.sh tests/*.sh scripts/*.sh packaging/*.sh packaging/debian/postinst)
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck -S warning "${scripts[@]}"
      - name: Installer sanity
        run: bash tests/installer-sanity.sh

  namespace:
    name: Firewall namespace test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install firewall tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iptables
      - name: Firewall integration in isolated network namespace
        run: bash tests/firewall-namespace.sh

  e2e:
    name: Kill switch e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the helper
        run: cargo build --release --locked --bin wg-helper
      - name: Install WireGuard and firewall tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wireguard-tools nftables iptables iproute2 iputils-ping
          sudo modprobe wireguard
      - name: WireGuard + kill switch + live config update (network namespaces)
        run: |
          test -f tests/killswitch-e2e.sh \
            || { echo "::error::tests/killswitch-e2e.sh is missing"; exit 1; }
          sudo bash tests/killswitch-e2e.sh target/release/wg-helper

  audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies against the RUSTSEC advisory DB
        # Fail on vulnerabilities and informational advisories; the locked
        # dependency graph currently needs no advisory exceptions.
        run: cargo audit --deny warnings

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cargo.toml, Cargo.lock, CHANGELOG, packaging and docs agree
        run: bash scripts/check-version.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine the minimum supported Rust version
        id: msrv
        run: |
          v="$(awk '/^\[/{p=($0=="[package]");next} p&&$1=="rust-version"{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
          echo "version=${v:-$MSRV_FALLBACK}" >> "$GITHUB_OUTPUT"
          echo "MSRV: ${v:-$MSRV_FALLBACK} (${v:+Cargo.toml rust-version}${v:-workflow fallback})" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - name: Build and test with the MSRV toolchain
        run: |
          cargo check --locked --all-targets
          cargo test --locked

  fuzz-check:
    name: Fuzz crate check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # The targets pull src/ modules in by path; this keeps them compiling on
      # every change. Running them needs nightly (see .github/workflows/fuzz.yml).
      - name: Check fuzz targets (stable)
        working-directory: fuzz
        run: cargo clippy --locked --bins -- -D warnings

  coverage:
    # Informational: not a required check.
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov
      - name: Measure test coverage
        run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          {
            echo "## Test coverage"
            echo
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 30
