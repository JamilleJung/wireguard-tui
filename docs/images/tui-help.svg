<svg xmlns="http://www.w3.org/2000/svg" width="974" height="583" viewBox="0 0 974 583" role="img" aria-labelledby="title description" font-family="SFMono-Regular,Menlo,DejaVu Sans Mono,monospace" font-size="15">
<title id="title">wg-tui: The scrollable key map</title>
<desc id="description">Rendered from application code with a 110 by 30 Ratatui TestBackend and fictional data: example tunnel names, keys and documentation addresses. The scrollable key map. No live system or network was accessed.</desc>
<rect width="974" height="583" rx="8" fill="#181825"/>
<text x="14.0" y="28.0" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">┌ WireGuard - terminal ──────────────────────────────────────────────────────────────────────────────────────┐</text>
<text x="14.0" y="46.5" fill="#cdd6f4" textLength="17.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│ </text>
