<text x="22.6" y="102.0" fill="#f5f5ff" font-weight="700" textLength="163.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> * home            </text>
<text x="186.0" y="102.0" fill="#cdd6f4" textLength="774.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│  Enter/a         Connect / disconnect                              │                   │</text>
<text x="14.0" y="120.5" fill="#cdd6f4" textLength="8.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
