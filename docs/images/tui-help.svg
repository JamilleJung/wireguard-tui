<text x="31.2" y="46.5" fill="#11111b" font-weight="700" textLength="77.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Tunnels </text>
<text x="108.6" y="46.5" fill="#cdd6f4" textLength="851.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> │  Log  ┌ wg-tui v1.10.0 keys (↑↓ PgUp/PgDn scroll, other keys close) ───────┐                   │</text>
<text x="14.0" y="65.0" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">└───────────────────│  TUNNELS TAB                                                       │───────────────────┘</text>
<text x="14.0" y="83.5" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">┌ Tunnels ──────────│  Up/Dn k/j       Move between tunnels                              │───────────────────┐</text>
