<text x="14.0" y="231.5" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  ] / [           Jump to next / previous peer                      │                   │</text>
<text x="14.0" y="250.0" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  PgDn/PgUp       Scroll the detail pane                            │                   │</text>
<text x="14.0" y="268.5" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  y               Copy focused field                                │                   │</text>
<text x="14.0" y="287.0" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  D               Diagnose connection                               │                   │</text>
<text x="14.0" y="305.5" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │                                                                    │                   │</text>
