<text x="48.4" y="120.5" fill="#cdd6f4" textLength="911.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">office          │  n               New tunnel                                        │                   │</text>
<text x="14.0" y="139.0" fill="#cdd6f4" textLength="8.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="22.6" y="139.0" fill="#9399b2" textLength="25.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - </text>
<text x="48.4" y="139.0" fill="#cdd6f4" textLength="739.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">travel          │  i               Import .conf or QR image                          │</text>
