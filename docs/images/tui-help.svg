<text x="14.0" y="379.5" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  E               Reopen a kept (unsaved) draft                     │                   │</text>
<text x="14.0" y="398.0" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  g               Generate keys                                     │                   │</text>
<text x="14.0" y="416.5" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  c               Show running config                               │                   │</text>
<text x="14.0" y="435.0" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  p               Save live state to .conf                          │                   │</text>
<text x="14.0" y="453.5" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  K               Kill switch on/off/repair                         │                   │</text>
<text x="14.0" y="472.0" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  R               Rename                                            │                   │</text>
<text x="14.0" y="490.5" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  x               Export all to ~/wireguard-tunnels.zip             │                   │</text>
<text x="14.0" y="509.0" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │                                                                    │                   │</text>
<text x="14.0" y="527.5" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│                   │  LOG TAB  (press Tab)                                              │                   │</text>
<text x="14.0" y="546.0" fill="#cdd6f4" textLength="946.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">└───────────────────└────────────────────────────────────────────────────────────────────┘───────────────────┘</text>
<text x="14.0" y="564.5" fill="#9399b2" textLength="877.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Up/Dn move  Enter on/off  n new  i import  d remove  Q qr  y copy  D diagnose  Tab log  …  ? all keys</text>
